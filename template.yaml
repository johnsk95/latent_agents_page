tldr: |
  We introduce **Latent Agents**, a post-training method that enables LLMs to internally simulate multi-agent debates through lightweight steering vectors. By learning debate dynamics from smaller models and applying them as activation steering, we achieve significant performance improvements on reasoning tasks while maintaining computational efficiency—demonstrating that complex multi-agent behaviors can be internalized within a single model.
abstract: |
  Multi-agent debate (MAD) has emerged as a powerful approach for improving reasoning in large language models (LLMs), where multiple agents engage in structured discussions to solve complex problems. However, MAD requires generating multiple responses for each inference step, significantly increasing computational costs. In this work, we introduce **Latent Agents**, a post-training procedure that internalizes MAD within a single model. By extracting steering vectors that encode the debating dynamics between smaller models and applying these vectors to larger models, we enable LLMs to implicitly simulate multi-agent reasoning patterns without the need for explicit multiple generations.

  Our experiments across multiple reasoning benchmarks show that Latent Agents achieves comparable or superior performance to traditional MAD while reducing inference costs by 2-4x. We further demonstrate that the learned steering vectors capture meaningful debate strategies, including perspective-taking, critical evaluation, and consensus building behaviors. Our analysis reveals that these behaviors can be localized to specific model layers and that the steering vectors generalize across different model families and scales. This work suggests that complex multi-agent behaviors can be efficiently encoded as lightweight activation patterns, opening new directions for enhancing LLM reasoning capabilities without architectural changes.

body:
  - title: Overview
    text: |
      Multi-agent debate (MAD) has shown remarkable success in improving LLM reasoning, but at a significant computational cost. Our work introduces a novel approach: **internalizing debate dynamics within a single model** through lightweight steering vectors.

      <div class="uk-grid-small uk-child-width-1-2@m" uk-grid>
        <div>
          <img src="imad1_cropped.png">
          <span class="uk-text-meta">Traditional MAD vs. Latent Agents approach</span>
        </div>
        <div>
          <img src="imad2.png">
          <span class="uk-text-meta">Extracting and applying steering vectors</span>
        </div>
      </div>

  - title: Method
    text: |
      ### 1. Extract Debate Dynamics from Smaller Models
      We begin by running multi-agent debates between smaller models (e.g., Llama-3.1-8B) and capturing their activation patterns during debate:

      <div class="uk-text-center">
        <img src="imad2_setup_subspace.png" width="80%">
        <span class="uk-text-meta">Extracting activation differences between debating agents</span>
      </div>

      ### 2. Learn Steering Vectors
      We compute steering vectors that encode the debate dynamics:
      $$\mathbf{v}_{\text{steer}} = \frac{1}{N} \sum_{i=1}^{N} (\mathbf{a}_{\text{debate}}^{(i)} - \mathbf{a}_{\text{base}}^{(i)})$$

      ### 3. Apply to Larger Models
      These lightweight vectors (< 1MB) can be applied to larger models during inference:
      $$\mathbf{h}'_l = \mathbf{h}_l + \alpha \cdot \mathbf{v}_{\text{steer}}^{(l)}$$

      where $\mathbf{h}_l$ is the hidden state at layer $l$ and $\alpha$ controls the steering strength.
  - title: Results
    text: |
      ### Performance Improvements
      Latent Agents achieves significant improvements across multiple reasoning benchmarks:

      <div class="uk-grid-small uk-child-width-1-3@m" uk-grid>
        <div>
          <img src="chart_acc.png">
          <span class="uk-text-meta">Accuracy improvements on reasoning tasks</span>
        </div>
        <div>
          <img src="chart_perf.png">
          <span class="uk-text-meta">Performance vs. computational cost</span>
        </div>
        <div>
          <img src="chart_tok.png">
          <span class="uk-text-meta">Token efficiency comparison</span>
        </div>
      </div>

      ### Key Findings

      | **Method** | **GSM8K** | **MATH** | **HumanEval** | **Tokens Used** |
      |------------|-----------|----------|---------------|----------------|
      | Base Model | 78.2% | 42.1% | 71.3% | 1x |
      | MAD (3 agents) | 85.7% | 51.3% | 78.9% | 3.2x |
      | **Latent Agents** | **84.9%** | **50.8%** | **77.4%** | **1.1x** |

      - **2-4x reduction** in inference cost compared to traditional MAD
      - **Comparable performance** to explicit multi-agent systems
      - **Generalizes** across different model families and scales
      - **Interpretable** steering vectors reveal debate strategies
  - title: Analysis
    text: |
      ### Understanding Learned Debate Behaviors

      Our analysis reveals that steering vectors capture meaningful debate strategies:

      <div class="uk-grid-small uk-child-width-1-2@m" uk-grid>
        <div>
          <img src="steering_horizontal.png">
          <span class="uk-text-meta">Layer-wise analysis of steering vector effects</span>
        </div>
        <div>
          <img src="vector_extraction.png">
          <span class="uk-text-meta">Visualization of extracted debate patterns</span>
        </div>
      </div>

      ### Interpretability Studies

      Through probing experiments, we identify three key behaviors encoded in the steering vectors:

      1. **Perspective-taking**: Early layers encode alternative viewpoints
      2. **Critical evaluation**: Middle layers enhance error detection
      3. **Consensus building**: Later layers promote solution synthesis

      ### Generalization Across Models

      <div class="uk-grid-small uk-child-width-1-2@m" uk-grid>
        <div>
          <img src="rouge_llama.png">
          <span class="uk-text-meta">Cross-model transfer on Llama family</span>
        </div>
        <div>
          <img src="rouge-full.png">
          <span class="uk-text-meta">Performance across different architectures</span>
        </div>
      </div>

  - title: Implementation
    text: |
      ### Getting Started

      ```python
      # Install the latent_agents package
      pip install latent-agents

      # Load pre-trained steering vectors
      from latent_agents import LatentAgents

      model = LatentAgents.from_pretrained("llama-3.1-70b")
      model.load_steering_vectors("debate-gsmk8")

      # Use for inference
      response = model.generate(
          prompt="Solve: If a train travels 120 miles...",
          use_latent_agents=True,
          steering_strength=0.8
      )
      ```

      ### Training Your Own Steering Vectors

      ```python
      # Extract debate dynamics from smaller models
      from latent_agents import extract_debate_vectors

      vectors = extract_debate_vectors(
          model_a="llama-3.1-8b",
          model_b="llama-3.1-8b",
          dataset="gsm8k",
          num_debates=1000
      )

      # Apply to larger models
      target_model.apply_steering_vectors(vectors)
      ```

      ### Available Pre-trained Vectors

      We provide steering vectors for various tasks:
      - Mathematical reasoning (GSM8K, MATH)
      - Code generation (HumanEval, MBPP)
      - Commonsense reasoning (HellaSwag, WinoGrande)
      - General instruction following
